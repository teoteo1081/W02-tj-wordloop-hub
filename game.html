<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TJ WordLoop · Phòng game</title>
<link rel="icon" href="icon.svg">
<!-- Google tag (gtag.js) — cùng property GA4 với WordLoop -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-6X5S109XKM"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-6X5S109XKM');</script>
<link rel="stylesheet" href="css/game.css?v=1">
</head>
<body>
<!-- 🎮 Phòng game chơi chung — xem README.md "Việc còn dang dở" > PHÒNG GAME, bảng: tools/game_schema.sql.
     Game IM LẶNG hoàn toàn (chơi kèm voice HelloTalk) — báo đúng/sai bằng màu. -->
<header class="g-top">
  <a class="g-brand" href="./" title="Về TJ WordLoop">🎮 <b>WordLoop Game</b></a>
  <span class="g-room" id="g-room-badge" hidden></span>
  <button class="g-me" id="g-me" hidden></button>
</header>

<main id="g-main">
  <!-- 1. Tên + ảnh -->
  <section class="g-screen" id="s-name" hidden>
    <h1>Bạn tên gì?</h1>
    <p class="g-sub">Máy này sẽ nhớ tên cho lần sau — không cần email.</p>
    <input id="n-name" class="g-input" maxlength="24" placeholder="Nhập tên…" autocomplete="nickname">
    <h2>Chọn ảnh đại diện</h2>
    <div class="g-avatars" id="n-avatars"></div>
    <label class="g-btn g-btn-soft g-upload">📷 Tải ảnh của bạn<input type="file" id="n-file" accept="image/*" hidden></label>
    <div class="g-row"><button class="g-btn" id="n-save">Lưu & tiếp tục →</button></div>
    <p class="g-err" id="n-err"></p>
  </section>

  <!-- 2. Trang chính: host tạo phòng / người chơi nhập mã -->
  <section class="g-screen" id="s-home" hidden>
    <div class="g-card" id="h-join">
      <h2>Vào phòng</h2>
      <div class="g-row"><input id="h-code" class="g-input g-code" maxlength="5" placeholder="MÃ PHÒNG"><button class="g-btn" id="h-go">Vào</button></div>
      <p class="g-err" id="h-err"></p>
    </div>
    <div class="g-card" id="h-host" hidden>
      <h2>Mở phòng mới <span class="g-tag">Host</span></h2>
      <p class="g-sub">Chọn 1 hoặc nhiều nhánh từ vựng:</p>
      <div class="g-scope-picked" id="h-picked"></div>
      <div class="g-tree" id="h-tree"><p class="g-sub">Đang tải cây thư mục…</p></div>
      <div class="g-settings">
        <label>Kiểu chơi
          <select id="h-mode"><option value="kahoot">Cùng 1 câu (kiểu Kahoot)</option><option value="free">Tự do — ai nhanh nhiều điểm</option></select></label>
        <label>Nghĩa hiển thị bằng <select id="h-lang"><option value="vi">🇻🇳 Tiếng Việt</option><option value="en">🇺🇸 English (định nghĩa)</option><option value="es">🇪🇸 Español</option><option value="zh">🇨🇳 中文</option></select></label>
        <label>Số phút cả trận <input type="number" id="h-min" min="1" max="60" step="1" value="5"></label>
        <label id="h-qs-wrap">Giây mỗi câu <input type="number" id="h-qs" min="5" max="60" step="1" value="15"></label>
      </div>
      <div class="g-row"><button class="g-btn" id="h-create">🎮 Tạo phòng</button></div>
      <p class="g-err" id="h-cerr"></p>
    </div>
  </section>

  <!-- 3. Phòng chờ -->
  <section class="g-screen" id="s-lobby" hidden>
    <div class="g-card">
      <div class="g-lobby-head">
        <div><div class="g-sub">Mã phòng</div><div class="g-bigcode" id="l-code"></div></div>
        <button class="g-btn g-btn-soft" id="l-copy">🔗 Copy link mời</button>
      </div>
      <div class="g-sub" id="l-info"></div>
    </div>
    <h2>Người chơi (<span id="l-count">0</span>)</h2>
    <div class="g-players" id="l-players"></div>
    <div class="g-card" id="l-host" hidden>
      <div class="g-settings">
        <label>Kiểu chơi
          <select id="l-mode"><option value="kahoot">Cùng 1 câu (kiểu Kahoot)</option><option value="free">Tự do — ai nhanh nhiều điểm</option></select></label>
        <label>Nghĩa hiển thị bằng <select id="l-lang"><option value="vi">🇻🇳 Tiếng Việt</option><option value="en">🇺🇸 English (định nghĩa)</option><option value="es">🇪🇸 Español</option><option value="zh">🇨🇳 中文</option></select></label>
        <label>Số phút <input type="number" id="l-min" min="1" max="60" step="1"></label>
        <label id="l-qs-wrap">Giây mỗi câu <input type="number" id="l-qs" min="5" max="60" step="1"></label>
      </div>
      <div class="g-row"><button class="g-btn" id="l-start">▶ Bắt đầu</button></div>
      <p class="g-sub" id="l-pool"></p>
    </div>
    <p class="g-sub g-wait" id="l-wait">Chờ host bắt đầu…</p>
  </section>

  <!-- 4. Đang chơi: nửa trên bảng xếp hạng, nửa dưới trả lời -->
  <section class="g-screen g-play" id="s-play" hidden>
    <div class="g-clock"><span id="p-left">5:00</span><span class="g-sub" id="p-mode"></span><button class="g-btn g-btn-soft g-btn-sm" id="p-stop" hidden>⏹ Kết thúc</button></div>
    <ol class="g-board" id="p-board"></ol>
    <div class="g-q">
      <div class="g-qbar"><div id="p-qbar"></div></div>
      <div class="g-qvi" id="p-vi"></div>
      <div class="g-opts" id="p-opts"></div>
      <div class="g-sub g-qmsg" id="p-msg"></div>
    </div>
  </section>

  <!-- 5. Kết quả -->
  <section class="g-screen" id="s-end" hidden>
    <h1>🏁 Kết quả</h1>
    <div class="g-sub" id="e-info"></div>
    <ol class="g-board g-board-end" id="e-board"></ol>
    <div class="g-row"><a class="g-btn g-btn-soft" href="game.html">← Về trang game</a></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=4"></script>
<script src="js/game.js?v=2"></script>
</body>
</html>
